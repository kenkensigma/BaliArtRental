<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" fill="none" role="img" aria-label="Bali Art Rental &amp; Production Logo">
  <!-- Monogram Mark -->
  <g transform="translate(4, 8)">
    <!-- Architectural Pavilion / Diamond Monogram -->
    <path d="M30 4 L56 30 L30 56 L4 30 Z" stroke="#B6A078" stroke-width="1.75" fill="none" stroke-linejoin="round" opacity="0.9"/>
    <path d="M30 13 L47 30 L30 47 L13 30 Z" stroke="#393833" stroke-width="1" fill="none"/>
    <!-- Central Art Needle / Pillar -->
    <path d="M30 4 L30 56" stroke="#B6A078" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 30 L44 30" stroke="#B6A078" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Small geometric accents -->
    <circle cx="30" cy="30" r="2.5" fill="#F1EEE7"/>
    <circle cx="30" cy="4" r="1.5" fill="#B6A078"/>
    <circle cx="30" cy="56" r="1.5" fill="#B6A078"/>
  </g>

  <!-- Typography: Bali Art -->
  <text x="80" y="36" font-family="'Cormorant Garamond', 'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#F1EEE7" letter-spacing="3.5">BALI ART</text>

  <!-- Divider Rule -->
  <line x1="80" y1="45" x2="390" y2="45" stroke="#393833" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Subtitle: Rental & Production -->
  <text x="80" y="60" font-family="'Plus Jakarta Sans', 'Manrope', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#B6A078" letter-spacing="4.8">RENTAL &amp; PRODUCTION</text>
</svg>
